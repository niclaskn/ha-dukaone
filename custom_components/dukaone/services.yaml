set_mode:
  target:
    entity:
      integration: dukaone
      domain: fan
  fields:
    mode:
      required: true
      example: "inout"
      selector:
        select:
          options:
            - "in"
            - "out"
            - "inout"
reset_filter_timer:
  target:
    entity:
      integration: dukaone
      domain: fan
set_manual_speed:
  target:
    entity:
      integration: dukaone
      domain: fan
  fields:
    manual_speed:
      required: true
      example: 100
      selector:
        number:
          min: 0
          max: 255
          mode: box
